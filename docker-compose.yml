version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: finora-postgres
    environment:
      POSTGRES_DB: finora
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora
    ports:
      - "5432:5432"
    volumes:
      - finora-pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finora-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finora.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  finora-pgdata:
