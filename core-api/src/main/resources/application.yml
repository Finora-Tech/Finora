server:
  port: 8080

spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://localhost:5432/finora
    username: finora
    password: finora
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /v3/api-docs
